# Minimal SFT run: prove the engine trains and saves a checkpoint.
swift:
  tuner_type: lora
  lora_rank: 8
  lora_alpha: 32
  max_steps: 3
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  max_length: 1024
  logging_steps: 1
  save_steps: 3
  save_total_limit: 1
  torch_dtype: bfloat16
  gradient_checkpointing: true
  dataloader_num_workers: 0
