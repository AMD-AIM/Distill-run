# Student SFT on an existing SFT JSONL.
# Keys under `swift` are passed through to `swift sft` as `--key value` and are
# validated against the installed SftArguments before training starts.
swift:
  tuner_type: lora
  lora_rank: 8
  lora_alpha: 32
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  max_length: 2048
  logging_steps: 5
  save_steps: 200
  save_total_limit: 2
  torch_dtype: bfloat16
  gradient_checkpointing: true
