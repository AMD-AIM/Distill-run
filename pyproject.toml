[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distill-run"
version = "0.1.0"
description = "One command for black-box and white-box knowledge distillation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Heavy frameworks (torch / trl / ms-swift / easydistill) are deliberately NOT
# runtime dependencies: they come with the container image and are imported lazily
# by each engine, so parameter validation and dataset resolution stay CPU-only and
# the test suite runs anywhere.
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.23"]
dataset = ["datasets>=2.18", "pyarrow>=14"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
distill-run = "distill_run.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires GPU and real model weights",
    "slow: long-running smoke test",
]
